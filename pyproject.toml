[project]
name = "shopcart"
version = "0.4.0"
description = "Backend API for a small online shop: catalogue, cart, coupons and checkout."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.115.6",
    "pydantic~=2.10.4",
    "uvicorn~=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.4",
    "httpx~=0.28.1",
]

[dependency-groups]
dev = [
    "pytest~=8.3.4",
    "httpx~=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopcart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
]
